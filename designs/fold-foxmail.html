<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Foxmail</title>
<style>
:root{
  --win:#FFFFFF; --rail:#F7F8FA; --side:#F7F8FA; --line:#EDEFF2; --line2:#F2F4F6;
  --ink:#1F2328; --ink2:#6B7280; --ink3:#A7ADB6;
  --acc:#2D7FF9; --acc-soft:#E8F1FF; --sel:#2D7FF9;
  --hover:#F3F6FA; --chip:#EEF1F5; --shadow:0 8px 30px rgba(31,35,41,.16);
}
:root[data-theme="dark"]{
  --win:#1B1E22; --rail:#15181B; --side:#171A1E; --line:#2E3339; --line2:#252A30;
  --ink:#E6E9ED; --ink2:#9BA3AD; --ink3:#6E7681;
  --acc:#5B93F0; --acc-soft:#243450; --sel:#2D6FE0;
  --hover:#252A31; --chip:#2A3038; --shadow:0 8px 30px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--win);color:var(--ink);font-size:12px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font-family:inherit;color:inherit}
.hidden{display:none!important}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(130,140,150,.3);border-radius:8px;border:2px solid transparent;background-clip:padding-box}

.app{height:100vh;display:flex;flex-direction:column;background:var(--win)}

/* 顶部横栏：只有左上角红绿灯 + 搜索框 */
.topbar{height:38px;flex:none;display:flex;align-items:center;gap:14px;padding:0 14px;background:var(--win);border-bottom:1px solid var(--line)}
.traffic{display:flex;gap:8px;align-items:center;flex:none}
.traffic i{width:12px;height:12px;border-radius:50%;display:block}
.traffic i:nth-child(1){background:#FF5F57}.traffic i:nth-child(2){background:#FEBC2E}.traffic i:nth-child(3){background:#28C840}
.tsearch{display:flex;align-items:center;gap:7px;width:176px;height:24px;padding:0 9px;border-radius:6px;background:var(--side);border:1px solid var(--line);color:var(--ink3);transition:.14s}
.tsearch:focus-within{background:var(--win);border-color:var(--acc)}
.tsearch input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:11px;color:var(--ink)}
.tsearch input::placeholder{color:var(--ink3)}
.tsearch .filter{font-size:12px;cursor:pointer}

.body{flex:1;display:flex;min-height:0}

/* 第1栏：最左窄图标栏 */
.rail{width:46px;flex:none;background:var(--rail);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:6px}
.ric{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:var(--ink3);font-size:17px;cursor:pointer;position:relative;transition:.14s}
.ric:hover{background:var(--hover);color:var(--ink2)}
.ric.on{background:var(--acc-soft);color:var(--acc)}
.ric .cal{position:absolute;bottom:1px;font-size:8px;font-weight:700;color:var(--ink2)}
.ric.on .cal{color:var(--acc)}
.rail .grow{flex:1}

/* 第2栏：文件夹栏 */
.side{width:180px;flex:none;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:0 0 8px;overflow-y:auto}
.side-top{height:40px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 14px;color:var(--ink3)}
.side-top .ic{font-size:15px;cursor:pointer}
.side-top .ic:hover{color:var(--ink)}
.compose{display:flex;align-items:center;justify-content:center;gap:8px;height:34px;margin:2px 14px 14px;border:1px solid var(--acc);border-radius:7px;color:var(--acc);font-size:12.5px;font-weight:600;transition:.14s}
.compose:hover{background:var(--acc-soft)}
.acct{display:flex;align-items:center;gap:6px;padding:0 14px 10px;font-size:11.5px;color:var(--ink2);cursor:pointer}
.acct .caret{font-size:9px;color:var(--ink3)}
.folders{padding:0 8px}
.fitem{display:flex;align-items:center;gap:9px;height:30px;padding:0 10px;border-radius:6px;color:var(--ink2);font-size:12px;cursor:pointer;transition:.12s}
.fitem:hover{background:var(--hover)}
.fitem.on{background:#E4EEFC;color:var(--acc);font-weight:600}
:root[data-theme="dark"] .fitem.on{background:var(--acc-soft)}
.fitem .fi{width:16px;text-align:center;font-size:13px;opacity:.85}
.fitem .badge{margin-left:auto;background:var(--acc);color:#fff;font-size:10px;min-width:18px;text-align:center;border-radius:9px;padding:1px 5px}

/* 第3栏：邮件列表 */
.list{width:236px;flex:none;background:var(--win);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.list-bar{height:40px;flex:none;display:flex;align-items:center;gap:2px;padding:0 10px;border-bottom:1px solid var(--line)}
.lb{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--ink3);font-size:15px;cursor:pointer}
.lb:hover{background:var(--hover);color:var(--ink)}
.rows{flex:1;overflow-y:auto;min-height:0}
.mrow{display:flex;gap:9px;padding:9px 10px 9px 12px;border-bottom:1px solid var(--line2);cursor:pointer;position:relative;transition:background .12s}
.mrow:hover{background:var(--hover)}
.mrow.on{background:var(--sel);color:#fff}
.mrow.on .mname,.mrow.on .msub,.mrow.on .mtime{color:#fff}
.mrow.on .mprev{color:rgba(255,255,255,.82)}
.mrow .dot{position:absolute;left:4px;top:14px;width:6px;height:6px;border-radius:50%;background:var(--acc)}
.mava{width:30px;height:30px;flex:none;border-radius:7px;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;letter-spacing:.3px}
.mrow-main{flex:1;min-width:0}
.mtop{display:flex;align-items:baseline;gap:6px}
.mname{font-size:12px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.mtime{font-size:10px;color:var(--ink3);flex:none}
.msub{font-size:11.5px;color:var(--ink);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mprev{font-size:10.5px;color:var(--ink3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 第4栏：正文 */
.read{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--win);min-height:0}
.read-bar{height:40px;flex:none;display:flex;align-items:center;gap:2px;padding:0 16px;border-bottom:1px solid var(--line)}
.rb{width:30px;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--ink3);font-size:17px;cursor:pointer}
.rb:hover{background:var(--hover);color:var(--ink)}
.read-bar .grow{flex:1}
.scroll{flex:1;overflow-y:auto;min-height:0}
.mailhead{max-width:680px;margin:0 auto;padding:22px 30px 14px}
.mh-title{font-size:17px;font-weight:650;letter-spacing:-.2px;margin-bottom:12px}
.mh-from{font-size:11px;color:var(--ink3);line-height:1.6;word-break:break-all}
.mh-from b{color:var(--ink2);font-weight:500}
.mh-right{float:right;text-align:right;font-size:11px;color:var(--ink3);white-space:nowrap;margin-left:16px}
.mh-right .detail{color:var(--acc);cursor:pointer;margin-left:8px}
.mh-line{height:1px;background:var(--line);max-width:680px;margin:0 auto}

/* HTML 邮件正文（居中 newsletter 样式） */
.doc{max-width:640px;margin:0 auto;padding:36px 30px 70px;text-align:center}
.doc h1{font-size:26px;font-weight:700;letter-spacing:-.4px;margin:0 0 26px;color:var(--ink)}
.doc p{font-size:13.5px;line-height:1.9;color:var(--ink);margin:0 auto 22px;max-width:560px}
.cta{display:inline-block;background:#111418;color:#fff;font-size:13px;font-weight:600;padding:13px 24px;border-radius:24px;margin:2px 0 28px;cursor:pointer}
.cta:hover{background:#2a2f36}
.fb-q{font-size:13px;color:var(--ink2);margin:8px 0 14px}
.fb-btns{display:flex;gap:10px;justify-content:center;margin-bottom:38px}
.fb{border:1px solid var(--line);background:var(--chip);color:var(--ink2);font-size:12px;padding:8px 22px;border-radius:20px;cursor:pointer;transition:.14s}
.fb:hover{border-color:var(--acc);color:var(--acc)}
.fb.done{background:var(--acc-soft);border-color:var(--acc);color:var(--acc)}
.sign{background:#F1F2F4;border-radius:9px;padding:18px 20px;text-align:left;font-size:11px;color:var(--ink2);line-height:1.8;max-width:560px;margin:0 auto}
:root[data-theme="dark"] .sign{background:#24282E}
.sign b{color:var(--ink);font-size:12px}
.sign a{color:var(--acc);text-decoration:none}

.empty{height:100%;display:grid;place-items:center;color:var(--ink3);font-size:12px}

/* 浮层 */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(20,24,30,.42);backdrop-filter:blur(2px);display:flex;justify-content:center;align-items:flex-start;padding-top:12vh;animation:fade .12s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.panel{width:min(560px,92vw);background:var(--win);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;animation:rise .16s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}
.pal-in{display:flex;align-items:center;gap:10px;padding:13px 15px;border-bottom:1px solid var(--line)}
.pal-in input{flex:1;border:0;outline:0;background:transparent;font-size:14px;color:var(--ink)}
.pal-in span{font-size:11px;color:var(--ink3)}
.pal-list{max-height:320px;overflow:auto;padding:6px}
.pal-item{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:7px;cursor:pointer}
.pal-item.sel{background:var(--acc-soft)}
.pico{width:24px;height:24px;border-radius:6px;background:var(--chip);display:grid;place-items:center;color:var(--ink2);font-size:12px}
.pt{font-size:12.5px}.ph{margin-left:auto;font-size:10px;color:var(--ink3)}
.cmp-h{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;font-weight:650;font-size:13px}
.cmp-h .x{margin-left:auto;cursor:pointer;color:var(--ink3)}
.cmp-f{display:flex;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line2);font-size:11px;color:var(--ink3)}
.cmp-f input{flex:1;border:0;outline:0;background:transparent;font-size:12.5px;color:var(--ink)}
.cmp-a{width:100%;min-height:170px;border:0;outline:0;resize:vertical;background:transparent;padding:15px 16px;font-size:13px;color:var(--ink)}
.cmp-foot{border-top:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:10px;font-size:11px;color:var(--ink2)}
.cmp-send{margin-left:auto;background:var(--acc);color:#fff;border:0;border-radius:6px;padding:8px 18px;font-size:11.5px;font-weight:600}
.kbdgrid{padding:16px 18px;display:grid;grid-template-columns:1fr 1fr;gap:9px 22px;font-size:12px;color:var(--ink2)}
.kbdgrid .kr{display:flex;justify-content:space-between}
.kbdgrid kbd{border:1px solid var(--line);border-radius:3px;padding:0 5px;font-size:10px}
.toasts{position:fixed;bottom:32px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:#2A2F36;color:#fff;padding:9px 14px;border-radius:8px;font-size:11.5px;display:flex;gap:14px;box-shadow:var(--shadow);animation:tin .2s}
@keyframes tin{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.toast.out{animation:tout .2s forwards}@keyframes tout{to{transform:translateY(8px);opacity:0}}
.toast button{color:#9DBEFF;font-weight:600}
@media(max-width:900px){.list{width:200px}.side{width:158px}}
@media(max-width:720px){.side{display:none}}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="traffic"><i></i><i></i><i></i></div>
    <div class="tsearch">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="searchInput" placeholder="搜索邮件" autocomplete="off">
      <span class="filter">☰</span>
    </div>
  </div>

  <div class="body">
    <nav class="rail">
      <div class="ric on" title="邮件">✉</div>
      <div class="ric" title="通讯录">▤</div>
      <div class="ric" title="日历">▦<span class="cal">18</span></div>
      <div class="grow"></div>
      <div class="ric" id="themeBtn" title="主题">◐</div>
      <div class="ric" id="helpBtn" title="快捷键">?</div>
      <div class="ric" title="设置">⚙</div>
    </nav>

    <aside class="side">
      <div class="side-top"><span class="ic" id="refreshBtn" title="收取">⟳</span><span class="ic" id="paletteBtn" title="命令面板">☰</span></div>
      <button class="compose" id="composeBtn">✎ 写邮件</button>
      <div class="acct"><span class="caret">▾</span> foxmail(ouyinheng)</div>
      <div class="folders">
        <div class="fitem on" data-f="inbox"><span class="fi">✉</span>收件箱<span class="badge">10</span></div>
        <div class="fitem" data-f="starred"><span class="fi">☆</span>星标邮件</div>
        <div class="fitem" data-f="sent"><span class="fi">➤</span>已发送</div>
        <div class="fitem" data-f="draft"><span class="fi">▤</span>草稿</div>
        <div class="fitem" data-f="trash"><span class="fi">🗑</span>已删除</div>
      </div>
    </aside>

    <section class="list">
      <div class="list-bar">
        <div class="lb" title="上一封">↩</div>
        <div class="lb" data-act="reply" title="回复">↪</div>
        <div class="lb" data-act="delete" title="删除">🗑</div>
      </div>
      <div class="rows" id="rows"></div>
    </section>

    <main class="read">
      <div class="read-bar">
        <div class="rb" data-act="reply" title="回复">↩</div>
        <div class="rb" data-act="replyall" title="回复全部">↪</div>
        <div class="rb" data-act="forward" title="转发">➤</div>
        <div class="rb" data-act="delete" title="删除">🗑</div>
        <div class="grow"></div>
        <div class="rb" data-act="star" title="星标">☆</div>
        <div class="rb" title="更多">···</div>
      </div>
      <div class="scroll" id="scroll"></div>
    </main>
  </div>
</div>

<div class="overlay hidden" id="paletteOverlay"><div class="panel"><div class="pal-in"><span>⌕</span><input id="palInput" placeholder="搜索邮件或执行操作…"><span>esc 关闭</span></div><div class="pal-list" id="palList"></div></div></div>
<div class="overlay hidden" id="helpOverlay"><div class="panel"><div class="pal-in"><b style="font-size:13px">快捷键</b><button class="x" id="helpClose" style="margin-left:auto;font-size:15px;color:var(--ink3)">✕</button></div><div class="kbdgrid" id="helpBody"></div></div></div>
<div class="overlay hidden" id="composeOverlay"><div class="panel"><div class="cmp-h">写邮件 <span class="x" id="cmpClose">✕</span></div><div class="cmp-f"><span style="width:34px">收件人</span><input id="cmpTo" placeholder="name@example.com"></div><div class="cmp-f"><span style="width:34px">主题</span><input id="cmpSubject"></div><textarea class="cmp-a" id="cmpBody" placeholder="写点什么…"></textarea><div class="cmp-foot">定时发送 · 10 秒可撤销<span style="flex:1"></span><button class="cmp-send" id="cmpSend">发送</button></div></div></div>
<div class="toasts" id="toasts"></div>

<script>
const $= (s,r=document)=>r.querySelector(s);
const $$= (s,r=document)=>[...r.querySelectorAll(s)];
const esc= s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const MAILS=[
  {id:1,name:'QQ邮箱团队',time:'1分钟前',avatar:'QQ',color:'#12B7F5',subject:'「Foxmail」已获得了你的QQ邮箱...',prev:'「Foxmail」已获得了你的QQ邮箱...',unread:true},
  {id:2,name:'Instagram',time:'周日',avatar:'IG',color:'#C13584',subject:'ouyinheng，在动态中看看...',prev:'将发现的新用户，根据你的兴趣推荐...',unread:false},
  {id:3,name:'招商银行信用卡',time:'周五',avatar:'招',color:'#C7000B',subject:'1634元优惠券满减组合等期...',prev:'掌上生活，为您精选...',unread:false},
  {id:4,name:'一枝红杏',time:'周四',avatar:'杏',color:'#E8656B',subject:'40% 双十一前瞻优惠...',prev:'紧俏的款 oo，我们近期为你选上...',unread:false},
  {id:5,name:'Instagram',time:'周四',avatar:'IG',color:'#C13584',subject:'pzyteis, amz5222 和其他用户...',prev:'pzyteis, amz5222 和其他用户...',unread:false},
  {id:6,name:'ChatGPT',time:'周三',avatar:'✳',color:'#10A37F',subject:'移除背景中的干扰元素',prev:'分享图片前，这些细节调整下，让上...',unread:false},
  {id:7,name:'Instagram',time:'周三',avatar:'IG',color:'#C13584',subject:'40% 双十一前瞻优惠...',prev:'快来看看为你准备的内容...',unread:false},
  {id:8,name:'一枝红杏',time:'周三',avatar:'杏',color:'#E8656B',subject:'40% 双十一前瞻优惠...',prev:'紧俏的款 oo，我们近期为你选上...',unread:false},
  {id:9,name:'ChatGPT',time:'周三',avatar:'✳',color:'#10A37F',subject:'有 4 种新的语言模型...',prev:'在最新模型2下使用新功能，用全新...',unread:false},
  {id:10,name:'一枝红杏',time:'11-10',avatar:'杏',color:'#E8656B',subject:'双十一，双十一优惠...',prev:'一年一度的好价，别错过...',unread:true},
  {id:11,name:'ChatGPT',time:'11-09',avatar:'✳',color:'#10A37F',subject:'超赞的周末新模型...',prev:'花点时间了解最新的功能...',unread:true}
];
const state={selected:6,folder:'inbox',query:'',undo:[]};

function chatgptDoc(){
  return `<div class="mailhead">
    <div class="mh-title">移除背景中的干扰元素</div>
    <div class="mh-right">2026/11/12 15:27 <span class="detail">详情</span></div>
    <div class="mh-from">bounces+108370056-ed48-267537992@qq.com@email8623.email.openai.com <b>代表 ChatGPT 发送 267537992</b></div>
  </div>
  <div class="mh-line"></div>
  <div class="doc">
    <h1>让主体更突出</h1>
    <p>在 ChatGPT 的图像编辑工具中，上传一张房间或物品的图片，并指出背景中你想移除的干扰元素。ChatGPT 可以编辑该区域，同时尽可能保持主体和整体氛围与原图一致。</p>
    <div class="cta" id="ctaBtn">移除背景中的干扰元素</div>
    <p>比如，可以移除阅读椅后面的多余椅子，让椅子而不是杂物成为视觉焦点。</p>
    <div class="fb-q">这封电子邮件有帮助吗？</div>
    <div class="fb-btns"><button class="fb" data-fb="yes">有帮助</button><button class="fb" data-fb="no">没帮助</button></div>
    <div class="sign">
      <b>OpenAI</b><br>
      1455 3rd Street<br>
      San Francisco, CA 94158<br>
      United States<br><br>
      <a href="#">点击此处</a> 取消订阅<br>
      OpenAI © 2015-2026
    </div>
  </div>`;
}
function genericDoc(m){
  return `<div class="mailhead"><div class="mh-title">${esc(m.subject)}</div>
    <div class="mh-right">今天 ${esc(m.time)} <span class="detail">详情</span></div>
    <div class="mh-from"><b>${esc(m.name)}</b> &lt;${esc(m.name.toLowerCase().replace(/\s/g,''))}@example.com&gt;</div></div>
    <div class="mh-line"></div>
    <div class="doc"><p style="margin-top:36px">${esc(m.prev)}</p><p>这是一封来自 ${esc(m.name)} 的邮件。完整内容请查看原始邮件。</p></div>`;
}
function renderList(){
  const list=state.query?MAILS.filter(m=>(m.name+m.subject+m.prev).toLowerCase().includes(state.query.toLowerCase())):MAILS;
  $('#rows').innerHTML=list.map(m=>`<div class="mrow ${m.id===state.selected?'on':''}" data-id="${m.id}">
    ${m.unread?'<span class="dot"></span>':''}
    <div class="mava" style="background:${m.color}">${esc(m.avatar)}</div>
    <div class="mrow-main"><div class="mtop"><span class="mname">${esc(m.name)}</span><span class="mtime">${esc(m.time)}</span></div>
    <div class="msub">${esc(m.subject)}</div><div class="mprev">${esc(m.prev)}</div></div></div>`).join('');
}
function renderRead(){
  const m=MAILS.find(x=>x.id===state.selected);
  if(!m){$('#scroll').innerHTML='<div class="empty">选择一封邮件阅读</div>';return}
  $('#scroll').innerHTML=m.id===6?chatgptDoc():genericDoc(m);
  const cta=$('#ctaBtn'); if(cta) cta.onclick=()=>toast('已打开图像编辑功能');
  $$('.fb').forEach(b=>b.onclick=()=>{$$('.fb').forEach(x=>x.classList.remove('done'));b.classList.add('done');toast(b.dataset.fb==='yes'?'感谢反馈':'已记录反馈')});
}
function selectMail(id){state.selected=id;const m=MAILS.find(x=>x.id===id);if(m)m.unread=false;renderList();renderRead()}
function toast(msg,undo){
  const t=document.createElement('div');t.className='toast';t.innerHTML='<span>'+esc(msg)+'</span>'+(undo?'<button>撤销</button>':'');
  if(undo)t.querySelector('button').onclick=()=>{undo();t.remove()};
  $('#toasts').appendChild(t);setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),200)},undo?5000:2500);
}
function move(d){const list=MAILS;let i=list.findIndex(m=>m.id===state.selected);i=i<0?0:Math.min(list.length-1,Math.max(0,i+d));selectMail(list[i].id)}
function doAct(a){
  const m=MAILS.find(x=>x.id===state.selected);if(!m)return;
  if(a==='delete'){const idx=MAILS.indexOf(m);MAILS.splice(idx,1);toast('邮件已删除',()=>{MAILS.splice(idx,0,m);renderList();toast('已恢复')});const rest=MAILS[Math.min(MAILS.length-1,idx)]||MAILS[0];state.selected=rest?rest.id:null;renderList();renderRead()}
  else if(a==='star')toast('已切换星标');
  else toast(a==='reply'?'正在回复…':a==='replyall'?'正在全部回复…':a==='forward'?'正在转发…':'操作完成');
}
function toggleTheme(){const r=document.documentElement;r.dataset.theme=r.dataset.theme==='dark'?'light':'dark'}
function openCompose(){$('#composeOverlay').classList.remove('hidden');setTimeout(()=>$('#cmpTo').focus(),30)}

$('#rows').addEventListener('click',e=>{const r=e.target.closest('.mrow');if(r)selectMail(+r.dataset.id)});
$$('.rb[data-act],.lb[data-act]').forEach(b=>b.onclick=()=>doAct(b.dataset.act));
$$('.fitem').forEach(n=>n.onclick=()=>{$$('.fitem').forEach(x=>x.classList.remove('on'));n.classList.add('on');state.folder=n.dataset.f;state.query='';$('#searchInput').value='';renderList();renderRead()});
$('#searchInput').addEventListener('input',e=>{state.query=e.target.value.trim();renderList()});
$('#composeBtn').onclick=openCompose;$('#cmpClose').onclick=()=>$('#composeOverlay').classList.add('hidden');
$('#cmpSend').onclick=()=>{const to=$('#cmpTo').value.trim();if(!to){toast('请填写收件人');return}$('#composeOverlay').classList.add('hidden');toast('邮件已发送 · 10 秒可撤销',()=>toast('已撤回发送'))};
$('#themeBtn').onclick=toggleTheme;$('#refreshBtn').onclick=()=>toast('正在收取邮件…');
$('#paletteBtn').onclick=()=>toast('命令面板：⌘K');
$('#helpBtn').onclick=()=>$('#helpOverlay').classList.remove('hidden');$('#helpClose').onclick=()=>$('#helpOverlay').classList.add('hidden');
const helps=[['j / k','上下移动'],['↵','打开邮件'],['e','删除'],['s','星标'],['c','写邮件'],['/','搜索'],['⌘K','命令面板'],['?','快捷键']];
$('#helpBody').innerHTML=helps.map(([k,v])=>`<div class="kr"><span>${v}</span><kbd>${k}</kbd></div>`).join('');
$$('.overlay').forEach(o=>o.addEventListener('mousedown',e=>{if(e.target===o)o.classList.add('hidden')}));
document.addEventListener('keydown',e=>{
  const typing=['INPUT','TEXTAREA'].includes(e.target.tagName);
  if(e.key==='Escape'){$$('.overlay').forEach(o=>o.classList.add('hidden'));if(typing)e.target.blur();return}
  if(typing)return;
  const k=e.key.toLowerCase();
  if(k==='j'){e.preventDefault();move(1)}else if(k==='k'){e.preventDefault();move(-1)}
  else if(k==='c'){e.preventDefault();openCompose()}else if(k==='e'){e.preventDefault();doAct('delete')}
  else if(k==='s'){e.preventDefault();doAct('star')}else if(k==='/'){e.preventDefault();$('#searchInput').focus()}
  else if(k==='?'){e.preventDefault();$('#helpOverlay').classList.remove('hidden')}
});
renderList();renderRead();
</script>
</body>
</html>
