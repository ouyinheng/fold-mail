<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Fold — 融合版</title><style>
/* Aerion 风格：深板岩底 + 紫罗兰强调 */
:root{
  --bg:#14141B; --panel:#191922; --side:#101016; --rail:#0C0C11;
  --ink:#E8E6F0; --ink2:#9C97AC; --ink3:#6A6579;
  --line:#2A2836; --line2:#221F2D;
  --acc:#8B5CF6; --acc-soft:#2A2145; --acc-weak:#211A38;
  --hover:#211F2C; --sel:#2A2145; --unread:#A78BFA;
  --star:#E0A83B; --green:#3FB98A; --red:#E07070; --chip:#262333;
  --shadow:0 16px 48px rgba(0,0,0,.6),0 2px 8px rgba(0,0,0,.35);
  --shadow-sm:0 2px 10px rgba(0,0,0,.4);
}
:root[data-theme="light"]{
  --bg:#FFFFFF; --panel:#FBFAFD; --side:#F5F3F9; --rail:#EEEAF5;
  --ink:#241F30; --ink2:#6C6679; --ink3:#A19BAD;
  --line:#E6E1EF; --line2:#F0EDF5;
  --acc:#7C4DE6; --acc-soft:#EDE5FD; --acc-weak:#F5F0FE;
  --hover:#F2EFF8; --sel:#EDE5FD; --unread:#7C4DE6;
  --star:#E0A83B; --green:#2E9E72; --red:#D9534F; --chip:#EEEAF5;
  --shadow:0 16px 48px rgba(40,25,70,.16),0 2px 8px rgba(40,25,70,.06);
  --shadow-sm:0 2px 10px rgba(40,25,70,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font-family:inherit;color:inherit}
.hidden{display:none!important}
svg{display:block}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(130,140,150,.28);border-radius:8px;border:2px solid transparent;background-clip:padding-box}

.app{height:100vh;display:flex;flex-direction:column}

.kbd{font-family:inherit;font-size:10px;color:var(--ink3);border:1px solid var(--line);border-radius:4px;padding:1px 5px;line-height:1.3}
/* 写邮件主按钮（移入左栏 brand 下方） */
.compose-main{display:flex;align-items:center;justify-content:center;gap:8px;height:36px;margin:2px 12px 16px;border-radius:8px;background:var(--acc);color:#fff;font-size:12.5px;font-weight:600;transition:.14s;box-shadow:0 2px 8px rgba(58,99,216,.22)}
.compose-main:hover{background:var(--acc);filter:brightness(1.08)}
.compose-main:active{transform:scale(.985)}
.compose-main .ic{width:16px;height:16px}

.shell{flex:1;display:flex;min-height:0}

/* 第1栏 SVG 图标栏 */
.rail{width:54px;flex:none;background:var(--rail);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:14px 0 12px;gap:5px}
.ric{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--ink3);position:relative;transition:.14s}
.ric:hover{background:var(--hover);color:var(--ink2)}
.ric.on{background:var(--acc-soft);color:var(--acc)}
.ric.on::before{content:"";position:absolute;left:-8px;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--acc)}
.ric .ic{width:20px;height:20px}
.ric .dot{position:absolute;top:6px;right:7px;width:6px;height:6px;border-radius:50%;background:var(--acc);border:1.5px solid var(--rail)}
.rail .grow{flex:1}

/* 第2栏 文件夹 */
.side{width:206px;flex:none;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:0 0 10px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:9px;padding:16px 16px 14px}
.blogo{width:26px;height:26px;border-radius:7px;background:var(--acc);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
.bname{font-size:14px;font-weight:650;letter-spacing:-.2px}
.acct{display:flex;align-items:center;gap:8px;padding:0 14px 14px;font-size:11.5px;color:var(--ink2)}
.acct .ava{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,#7B93F0,#3A63D8);color:#fff;display:grid;place-items:center;font-size:10px;font-weight:700}
.acct .caret{margin-left:auto;color:var(--ink3);width:13px;height:13px}
.ngroup{margin-bottom:14px}
.nlabel{font-size:10px;letter-spacing:.6px;color:var(--ink3);padding:0 16px 6px;display:flex;justify-content:space-between;align-items:center}
.nlabel .add{width:14px;height:14px;cursor:pointer;color:var(--ink3)}
.nitem{display:flex;align-items:center;gap:10px;height:31px;margin:0 8px;padding:0 9px;border-radius:7px;color:var(--ink2);font-size:12px;cursor:pointer;transition:.12s}
.nitem:hover{background:var(--hover)}
.nitem.on{background:var(--sel);color:var(--acc);font-weight:600}
.nitem .ic{width:16px;height:16px}
.nitem .num{margin-left:auto;font-size:10.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.nitem.on .num{color:var(--acc)}
.nitem .badge{margin-left:auto;background:var(--acc);color:#fff;font-size:9.5px;min-width:17px;text-align:center;border-radius:9px;padding:1px 5px}
.side-foot{margin-top:auto;border-top:1px solid var(--line);padding:10px 8px 0;display:flex;gap:5px;align-items:center}
.seg{display:flex;background:var(--chip);border-radius:7px;padding:2px;flex:1}
.seg button{flex:1;font-size:10px;padding:4px 0;border-radius:5px;color:var(--ink3)}
.seg button.on{background:var(--bg);color:var(--ink);box-shadow:var(--shadow-sm)}
.mini{width:28px;height:26px;border-radius:6px;display:grid;place-items:center;color:var(--ink3)}
.mini:hover{background:var(--hover);color:var(--ink)}

/* 第3栏 列表 */
.list{width:352px;flex:none;background:var(--bg);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.list-head{height:46px;flex:none;display:flex;align-items:center;gap:8px;padding:0 16px;border-bottom:1px solid var(--line2)}
.list-head h2{font-size:14px;font-weight:650}
.list-head .n{font-size:11px;color:var(--ink3)}
.spacer{flex:1}
.mini-btn{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;color:var(--ink3)}
.mini-btn:hover{background:var(--hover);color:var(--ink)}
.list-search{display:flex;align-items:center;gap:8px;height:28px;margin:8px 12px 6px;padding:0 10px;border-radius:7px;background:var(--side);color:var(--ink3)}
.list-search:focus-within{background:var(--bg);box-shadow:inset 0 0 0 1px var(--acc)}
.list-search .ic{width:14px;height:14px}
.list-search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:11.5px;color:var(--ink)}
.list-search input::placeholder{color:var(--ink3)}
.rows{flex:1;overflow-y:auto;min-height:0}
.row{display:flex;gap:11px;padding:11px 14px;border-bottom:1px solid var(--line2);cursor:pointer;position:relative;transition:background .12s}
.row:hover{background:var(--hover)}
.row.on{background:var(--sel)}
.row.on::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--acc)}
.avatar{width:32px;height:32px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:650;color:#fff;letter-spacing:.2px}
.row-main{flex:1;min-width:0}
.r1{display:flex;align-items:baseline;gap:8px}
.rfrom{font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.row.unread .rfrom{color:var(--ink);font-weight:650}
.rtime{font-size:10px;color:var(--ink3);flex:none}
.rsub{font-size:12px;color:var(--ink);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.unread .rsub{font-weight:600}
.rprev{font-size:11px;color:var(--ink3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rmeta{display:flex;align-items:center;gap:6px;margin-top:6px}
.gtag{font-size:9.5px;padding:1px 6px;border-radius:4px;background:var(--chip);color:var(--ink3)}
.gtag.people{color:var(--acc);background:var(--acc-soft)}
.gtag.notice{color:#C9851E;background:rgba(233,162,59,.13)}
.gtag.news{color:var(--green);background:rgba(46,158,114,.12)}
.rmeta .ic{width:12px;height:12px;color:var(--ink3)}
.row-star{position:absolute;right:10px;bottom:9px;width:20px;height:20px;border-radius:5px;display:grid;place-items:center;color:var(--ink3);opacity:.45;transition:.12s}
.row:hover .row-star,.row.on .row-star{opacity:1}
.row-star:hover{background:var(--hover);color:var(--star)}
.row-star .ic{width:14px;height:14px}
.row-star.on{color:var(--star);opacity:1}
.row-star.on .ic{fill:var(--star)}

/* 第4栏 正文 */
.read{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.read-bar{height:46px;flex:none;display:flex;align-items:center;gap:2px;padding:0 16px;border-bottom:1px solid var(--line)}
.tb{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;color:var(--ink3);transition:.13s}
.tb:hover{background:var(--hover);color:var(--ink)}
.tb.on{color:var(--star)}
.tb.on .ic{fill:var(--star)}
.vsep{width:1px;height:16px;background:var(--line);margin:0 6px}
.scroll{flex:1;overflow-y:auto;min-height:0}
.paper{max-width:720px;margin:0 auto;padding:28px 36px 80px}
.subject{font-size:22px;font-weight:670;letter-spacing:-.4px;line-height:1.35;margin-bottom:18px}
.sender{display:flex;align-items:center;gap:11px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.sender .avatar{width:36px;height:36px;font-size:13px}
.sname{font-size:12.5px;font-weight:650}
.semail{font-size:10.5px;color:var(--ink3)}
.swhen{margin-left:auto;font-size:10.5px;color:var(--ink3);text-align:right}
.privacy{display:flex;align-items:center;gap:9px;margin:18px 0 4px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);font-size:11px;color:var(--ink2)}
.privacy .ic{width:15px;height:15px;color:var(--green)}
.privacy b{color:var(--ink);font-weight:600}
.privacy .more{margin-left:auto;color:var(--acc);cursor:pointer;display:flex;align-items:center;gap:4px;font-size:10.5px}
.privacy .more .ic{width:12px;height:12px;color:var(--acc)}
.pdetail{max-height:0;overflow:hidden;transition:max-height .26s ease;border:1px solid transparent;border-radius:8px;margin-top:0}
.pdetail.open{max-height:200px;border-color:var(--line);margin-top:8px}
.prow{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid var(--line2);font-size:11px;color:var(--ink2)}
.prow:last-child{border-bottom:0}
.prow code{font-family:ui-monospace,Menlo,monospace;color:var(--ink);font-size:10.5px}
.prow .state{margin-left:auto;font-size:10px;color:var(--ink3)}
.prow button{font-size:10px;color:var(--acc);border:1px solid var(--acc-soft);padding:2px 8px;border-radius:5px}
.body{font-size:13.5px;line-height:1.85;color:var(--ink);margin-top:22px}
.body p{margin-bottom:15px}
.body.serif{font-family:"Songti SC","Noto Serif SC",Georgia,serif;font-size:14.5px;line-height:1.9}
.attach{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0 6px}
.acard{display:flex;align-items:center;gap:10px;width:216px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--panel)}
.afile{width:34px;height:34px;border-radius:7px;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center;font-size:9px;font-weight:700;flex:none}
.aname{font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
.asize{font-size:10px;color:var(--ink3)}
.quick{margin-top:30px;border:1px solid var(--line);border-radius:9px;background:var(--panel);transition:.16s}
.quick:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-weak)}
.quick-h{display:flex;align-items:center;gap:8px;padding:11px 14px;font-size:11.5px;color:var(--ink3);cursor:text}
.quick-h .ic{width:15px;height:15px}
.quick textarea{width:100%;border:0;outline:0;background:transparent;resize:vertical;padding:0 14px 10px;font-size:12.5px;min-height:0;max-height:160px;transition:min-height .22s}
.quick.open textarea{min-height:88px}
.quick-f{display:none;align-items:center;gap:8px;padding:9px 14px;border-top:1px solid var(--line);font-size:10.5px;color:var(--ink3)}
.quick.open .quick-f{display:flex}
.quick-f .send{margin-left:auto;display:flex;align-items:center;gap:6px;background:var(--acc);color:#fff;border-radius:6px;padding:6px 13px;font-size:11px;font-weight:600}
.quick-f .send .ic{width:13px;height:13px}
.empty{height:100%;display:grid;place-items:center;color:var(--ink3);font-size:12px}

.status{height:26px;flex:none;display:flex;align-items:center;gap:16px;padding:0 16px;border-top:1px solid var(--line);background:var(--side);font-size:10.5px;color:var(--ink3)}
.status .live{width:6px;height:6px;border-radius:50%;background:var(--green);display:inline-block;margin-right:6px}

/* 浮层 */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(16,20,28,.42);backdrop-filter:blur(3px);display:flex;justify-content:center;align-items:flex-start;padding-top:11vh;animation:fade .12s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.panel{width:min(560px,92vw);background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;animation:rise .16s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}
.pal-in{display:flex;align-items:center;gap:10px;padding:13px 15px;border-bottom:1px solid var(--line)}
.pal-in .ic{width:17px;height:17px;color:var(--ink3)}
.pal-in input{flex:1;border:0;outline:0;background:transparent;font-size:14px;color:var(--ink)}
.pal-in span{font-size:11px;color:var(--ink3)}
.pal-list{max-height:330px;overflow:auto;padding:6px}
.pal-item{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:7px;cursor:pointer}
.pal-item.sel{background:var(--acc-soft)}
.pico{width:25px;height:25px;border-radius:6px;background:var(--chip);display:grid;place-items:center;color:var(--ink2)}
.pico .ic{width:14px;height:14px}
.pt{font-size:12.5px}.ph{margin-left:auto;font-size:10px;color:var(--ink3)}
.pal-empty{padding:22px;text-align:center;color:var(--ink3);font-size:11px}
.pal-foot{padding:8px 14px;border-top:1px solid var(--line);display:flex;gap:14px;font-size:10px;color:var(--ink3)}
.cmp-h{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;font-weight:650;font-size:13px}
.cmp-h .x{margin-left:auto}
.cmp-f{display:flex;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line2);font-size:11px;color:var(--ink3)}
.cmp-f input{flex:1;border:0;outline:0;background:transparent;font-size:12.5px;color:var(--ink)}
.cmp-a{width:100%;min-height:170px;border:0;outline:0;resize:vertical;background:transparent;padding:15px 16px;font-size:13px;color:var(--ink)}
.cmp-foot{border-top:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:12px;font-size:11px;color:var(--ink2)}
.cmp-send{margin-left:auto;display:flex;align-items:center;gap:7px;background:var(--acc);color:#fff;border:0;border-radius:7px;padding:8px 17px;font-size:11.5px;font-weight:600}
.kbdgrid{padding:16px 18px;display:grid;grid-template-columns:1fr 1fr;gap:9px 24px;font-size:12px;color:var(--ink2)}
.kbdgrid .kr{display:flex;justify-content:space-between}
.toasts{position:fixed;bottom:36px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:#262B34;color:#fff;padding:10px 14px;border-radius:8px;font-size:11.5px;display:flex;gap:14px;box-shadow:var(--shadow);animation:tin .2s}
@keyframes tin{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.toast.out{animation:tout .2s forwards}@keyframes tout{to{transform:translateY(8px);opacity:0}}
.toast button{color:#9DB8FF;font-weight:600}
@media(max-width:1040px){.side{width:180px}.list{width:316px}}
@media(max-width:820px){.side{display:none}}
</style></head>

   blocked:3, links:2,
   body:`<p>嗨，</p><p>周五前能给一版吗？包含移动端和交互说明，我会把标注补进 Figma。这版主要先对齐信息架构，视觉细节我们可以后面再磨。</p><p>另外有两个点想先跟你确认：</p><ul><li>收件箱默认切成「人 / 通知 / 订阅」三栏，这个分组逻辑你觉得合适吗？</li><li>隐私报告的展示位置——放在正文顶部，会不会打扰阅读？我在犹豫要不要做成可折叠的。</li></ul><blockquote>我们把阅读体验放在第一位，任何提示都不该盖过正文本身。</blockquote><p>如果没问题我就按这个方向推进了。辛苦！</p><p class="signature">— Alice<br><span style="color:var(--ink-3)">Product Design · Studio</span></p>`,

   blocked:0, links:0,

   time:'08:52', date:'今天 08:52', unread:true, starred:false, later:false, archived:false,
   blocked:2, links:5,
   body:`<p><strong>Build #247 succeeded</strong> on <code>main</code></p><p>All 128 tests passed in 1m 42s. Coverage: 87.4% (+0.6%).</p><h3>Changes</h3><ul><li>core: 全文索引支持附件名过滤</li><li>ui: 隐私报告展开动画</li><li>fix: 修复 IMAP IDLE 心跳在弱网下重连</li></ul><p style="color:var(--ink-3);font-size:12px">This email was sent because you are watching this repository.</p>`,

  {id:4, group:'people', from:'林晓', email:'linxiao@gmail.com', initials:'林', color:COLORS[3],
   subject:'这周末有空吗？', preview:'好久没见了，听说你最近在做一个邮件客户端？周末一起吃个饭聊聊。',
   time:'昨天', date:'昨天 21:40', unread:false, starred:false, later:true, archived:false,
   blocked:1, links:0,
   body:`<p>好久没见了！听说你最近在做一个邮件客户端，挺好奇的。周末一起吃个饭聊聊？</p><p>周六下午我都有空，地方你来定 ☕</p><p class="signature">林晓</p>`,
   attachments:[]},
  {id:5, group:'newsletter', from:'The Pragmatic Engineer', email:'newsletter@pragmaticengineer.com', initials:'PE', color:COLORS[4],
   subject:'Issue #142 · The anatomy of a great developer tool', preview:'What makes a developer tool feel "great"? It is not just speed — it is respect for the user',
   time:'昨天', date:'昨天 08:10', unread:false, starred:false, later:false, archived:false,
   blocked:4, links:9,
   body:`<p>Great developer tools share a quality that is hard to name: they feel <em>quiet</em>. They do not interrupt. They respect your attention.</p><h3>Three principles</h3><ul><li><strong>Speed is a feature</strong> — but perceived speed matters more than raw benchmarks.</li><li><strong>Keyboard first, mouse never punished</strong> — every action has a shortcut, but nothing is hidden behind one.</li><li><strong>Local first</strong> — the tool should work when the network does not.</li></ul><p>This week, we look at how the best tools in the ecosystem put these into practice.</p><p style="color:var(--ink-3);font-size:12px">You are receiving this because you subscribed. <a href="#">Unsubscribe</a></p>`,
   attachments:[]},
  {id:6, group:'notification', from:'Vercel', email:'notifications@vercel.com', initials:'V', color:COLORS[7],
   subject:'Deployment ready · fold-mail.vercel.app', preview:'Your deployment is live. Build completed in 42s with 0 errors.',
   time:'昨天', date:'昨天 07:33', unread:false, starred:false, later:false, archived:false,

  {id:7, group:'people', from:'Marcus Lee', email:'marcus@rustlang.cn', initials:'ML', color:COLORS[2],
   subject:'Rust 异步编程的一些思考', preview:'看完你发的那篇 tokio 源码解析，有几个想法想讨论一下，尤其是关于……',
   time:'周一', date:'周一 16:20', unread:false, starred:true, later:false, archived:false,
   blocked:0, links:1,
   body:`<p>看完你发的那篇 tokio 源码解析，有几个想法想讨论一下。</p><p>尤其是关于 <code>waker</code> 在跨线程唤醒时的内存序问题——我认为在 <code>ArcWake</code> 里用 <code>Release/Acquire</code> 就够了，不需要 SeqCst。你怎么看？</p><p class="signature">Marcus</p>`,
   attachments:[]},
  {id:8, group:'newsletter', from:'少数派', email:'weekly@sspai.com', initials:'少', color:COLORS[6],
   subject:'本周精选：把注意力还给阅读', preview:'5 款值得关注的效率工具，以及我们如何使用它们重建工作流',
   time:'周一', date:'周一 09:00', unread:false, starred:false, later:false, archived:false,

const $= (s,r=document)=>r.querySelector(s), $$= (s,r=document)=>[...r.querySelectorAll(s)];
const esc= s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const svg=(id,cls='ic')=>'<svg class="'+cls+'"><use href="#'+id+'"/></svg>';
const G={people:{n:'人',c:'people'},notification:{n:'通知',c:'notice'},newsletter:{n:'订阅',c:'news'}};
const state={folder:'inbox',query:'',listQuery:'',selected:1,undo:[],serif:false,palIdx:0,palItems:[]};
function vis(){
  let l=mails.filter(m=>!m.archived&&!m.deleted);
  if(['people','notification','newsletter'].includes(state.folder)) l=l.filter(m=>m.group===state.folder);
  else if(state.folder==='starred') l=l.filter(m=>m.starred);
  else if(state.folder==='later') l=l.filter(m=>m.later);
  else if(state.folder==='archive') l=mails.filter(m=>m.archived);
  if(state.query) l=l.filter(m=>[m.from,m.email,m.subject,m.preview].some(x=>x.toLowerCase().includes(state.query.toLowerCase())));
  if(state.listQuery) l=l.filter(m=>[m.from,m.subject].some(x=>x.toLowerCase().includes(state.listQuery.toLowerCase())));
  return l;
}
function counts(){
  const a=mails.filter(m=>!m.archived&&!m.deleted);
  $('#c-inbox').textContent=a.filter(m=>m.unread).length;
  ['people','notification','newsletter'].forEach(k=>{const e=$('#c-'+k);if(e)e.textContent=a.filter(m=>m.group===k&&m.unread).length||''});
  $('#c-starred').textContent=a.filter(m=>m.starred).length||'';
  $('#c-later').textContent=a.filter(m=>m.later).length||'';
  $('#c-archive').textContent=mails.filter(m=>m.archived).length||'';
  $('#unreadStatus').textContent=a.filter(m=>m.unread).length+' 封未读';
}
function renderNav(){
  $$('.nitem[data-f]').forEach(n=>n.classList.toggle('on',n.dataset.f===state.folder));
  $$('.ric[data-f]').forEach(n=>n.classList.toggle('on',n.dataset.f===state.folder));
  $('#listTitle').textContent=state.query?'搜索结果':({inbox:'全部收件箱',people:'人',notification:'通知',newsletter:'订阅',starred:'星标',later:'稍后处理',archive:'归档'}[state.folder]||'收件箱');
}
function renderList(){
  const l=vis();$('#listCount').textContent=l.length+' 封';
  $('#rows').innerHTML=l.length?l.map(m=>{
    const g=G[m.group];
    return '<div class="row '+(m.unread?'unread':'')+' '+(state.selected===m.id?'on':'')+'" data-id="'+m.id+'">'+
      '<div class="avatar" style="background:'+m.color+'">'+esc((m.initials||'?').slice(0,1))+'</div>'+
      '<div class="row-main"><div class="r1"><span class="rfrom">'+esc(m.from)+'</span><span class="rtime">'+esc(m.time)+'</span></div>'+
      '<div class="rsub">'+esc(m.subject)+'</div><div class="rprev">'+esc(m.preview)+'</div>'+
      '<div class="rmeta"><span class="gtag '+g.c+'">'+g.n+'</span>'+(m.attachments&&m.attachments.length?svg('i-clip'):'')+'</div></div>'+
      '<button class="row-star '+(m.starred?'on':'')+'" data-star="'+m.id+'" title="星标">'+svg('i-star')+'</button></div>';
  }).join(''):'<div class="empty" style="padding:50px 0">这里没有邮件</div>';
}
function renderRead(){
  const m=mails.find(x=>x.id===state.selected),box=$('#scroll');
  if(!m){box.innerHTML='<div class="empty">选一封邮件开始阅读</div>';return}
  const star=$('#starBtn');if(star)star.classList.toggle('on',!!m.starred);
  const att=m.attachments&&m.attachments.length?('<div class="attach">'+m.attachments.map(a=>
    '<div class="acard"><div class="afile">'+esc(a.n.split('.').pop().slice(0,4).toUpperCase())+'</div><div style="min-width:0"><div class="aname">'+esc(a.n)+'</div><div class="asz">'+esc(a.s)+'</div></div></div>').join('')+'</div>'):'';
  const priv=(m.blocked||m.links)?('<div class="privacy">'+svg('i-shield')+'<span>已拦截 <b>'+m.blocked+'</b> 个追踪像素 · <b>'+m.links+'</b> 个外部链接</span><button class="more" id="privMore">查看详情 '+svg('i-chevron')+'</button></div>'+
    '<div class="pdetail" id="pdetail"><div class="prow"><code>tracker.google-analytics.com</code><span class="state">已拦截</span><button>允许</button></div><div class="prow"><code>pixel.facebook.com</code><span class="state">已拦截</span><button>允许</button></div><div class="prow"><code>cdn.external-img.net</code><span class="state">外部图片</span><button>加载</button></div></div>'):'';
  box.innerHTML='<div class="paper"><div class="subject">'+esc(m.subject)+'</div>'+
    '<div class="sender"><div class="avatar" style="background:'+m.color+'">'+esc((m.initials||'?').slice(0,1))+'</div><div><div class="sname">'+esc(m.from)+'</div><div class="semail">&lt;'+esc(m.email)+'&gt;</div></div><div class="swhen">'+esc(m.date)+'</div></div>'+
    priv+'<div class="body '+(state.serif?'serif':'')+'">'+m.body+'</div>'+att+
    '<div class="quick" id="quick"><div class="quick-h">'+svg('i-reply')+'<b>快速回复</b><span style="color:var(--ink3)">'+esc(m.from)+'</span></div><textarea id="quickT" placeholder="写下回复…"></textarea><div class="quick-f"><span>发送后 10 秒可撤销</span><button class="send" id="quickSend">'+svg('i-send')+'发送回复</button></div></div></div>';
  const pm=$('#privMore');if(pm)pm.onclick=()=>{$('#pdetail').classList.toggle('open');pm.innerHTML=(($('#pdetail').classList.contains('open'))?'收起 ':'查看详情 ')+svg('i-chevron')};
  $$('#pdetail button').forEach(b=>b.onclick=()=>{const row=b.closest('.prow');row.querySelector('.state').textContent='已允许';b.textContent='✓';toast('隐私设置已更新')});
  $('#quick .quick-h').onclick=()=>$('#quick').classList.add('open');
  $('#quickSend').onclick=()=>{$('#quick').classList.remove('open');$('#quickT').value='';toast('回复已发送 · 可撤销',()=>toast('已撤回发送'))};
}
function renderAll(){renderNav();counts();renderList();renderRead()}
function selectMail(id,mark=true){state.selected=id;const m=mails.find(x=>x.id===id);if(mark&&m.unread)m.unread=false;renderAll();const el=$('.row[data-id="'+id+'"]');if(el)el.scrollIntoView({block:'nearest'})}
function setFolder(f){state.folder=f;state.query='';state.listQuery='';$('#listSearch').value='';renderAll()}
function move(d){const l=vis();if(!l.length)return;let i=l.findIndex(m=>m.id===state.selected);i=i<0?0:Math.min(l.length-1,Math.max(0,i+d));selectMail(l[i].id,false)}
function toast(msg,undo){const t=document.createElement('div');t.className='toast';t.innerHTML='<span>'+esc(msg)+'</span>'+(undo?'<button>撤销</button>':'');if(undo)t.querySelector('button').onclick=()=>{undo();t.remove()};$('#toasts').appendChild(t);setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),200)},undo?5000:2500)}
function doAct(a){
  const m=mails.find(x=>x.id===state.selected);if(!m)return;
  if(a==='star'){m.starred=!m.starred;toast(m.starred?'已加星标':'已取消星标');renderAll();return}
  if(a==='archive'||a==='delete'){
    const wa=m.archived,wd=m.deleted;if(a==='archive')m.archived=true;else m.deleted=true;
    const l=vis(),i=l.findIndex(x=>x.id===m.id),prev=l[i+1]||l[i-1];
    state.undo.push({m,wa,wd});
    toast(a==='archive'?'已归档':'已删除',()=>{m.archived=wa;m.deleted=wd;renderAll();selectMail(m.id,false)});
    setTimeout(()=>{state.selected=prev?prev.id:null;renderAll()},180);return;
  }
  toast(a==='reply'?'正在回复…':a==='replyall'?'正在全部回复…':'正在转发…');
}
function toggleTheme(){const r=document.documentElement;const dark=r.dataset.theme==='dark';r.dataset.theme=dark?'light':'dark';$('#themeIcon use').setAttribute('href',dark?'#i-sun':'#i-moon')}
function setDensity(d){document.documentElement.dataset.density=d;toast('已切换到'+(d==='compact'?'紧凑':'舒适')+'密度')}
function toggleSerif(){state.serif=!state.serif;renderRead();toast(state.serif?'已切换衬线字体':'已切换无衬线字体')}
function openCompose(){$('#composeOverlay').classList.remove('hidden');setTimeout(()=>$('#cmpTo').focus(),30)}

const CMDS=[
  {t:'写新邮件',h:'c',i:'i-edit',run:()=>openCompose()},
  {t:'搜索邮件',h:'/',i:'i-search',run:()=>setTimeout(()=>$('#listSearch').focus(),40)},
  {t:'全部收件箱',h:'g i',i:'i-mail',run:()=>setFolder('inbox')},
  {t:'人 / 通知 / 订阅',h:'',i:'i-users',run:()=>setFolder('people')},
  {t:'星标',h:'',i:'i-star',run:()=>setFolder('starred')},
  {t:'稍后处理',h:'',i:'i-clock',run:()=>setFolder('later')},
  {t:'归档',h:'',i:'i-archive',run:()=>setFolder('archive')},
  {t:'切换明暗主题',h:'',i:'i-moon',run:toggleTheme},
  {t:'紧凑 / 舒适',h:'',i:'i-menu',run:()=>setDensity(document.documentElement.dataset.density==='compact'?'comfortable':'compact')},
  {t:'正文衬线字体',h:'',i:'i-edit',run:toggleSerif},
  {t:'全部标为已读',h:'',i:'i-check',run:()=>{mails.forEach(m=>{if(!m.archived)m.unread=false});renderAll();toast('已全部标为已读')}}
];
function renderPal(){const q=$('#palInput').value.trim().toLowerCase();let items=CMDS.filter(c=>c.t.toLowerCase().includes(q));state.palItems=items;state.palIdx=Math.min(state.palIdx,Math.max(0,items.length-1));
  $('#palList').innerHTML=items.length?items.map((c,i)=>'<div class="pal-item '+(i===state.palIdx?'sel':'')+'" data-i="'+i+'"><span class="pico">'+svg(c.i)+'</span><span class="pt">'+esc(c.t)+'</span><span class="ph">'+esc(c.h||'')+'</span></div>').join(''):'<div class="pal-empty">没有匹配的命令</div>';
  $$('.pal-item').forEach(el=>{el.onmouseenter=()=>{state.palIdx=+el.dataset.i;$$('.pal-item').forEach(x=>x.classList.remove('sel'));el.classList.add('sel')};el.onclick=()=>execPal(+el.dataset.i)});}
function execPal(i){const c=state.palItems[i];if(!c)return;$('#paletteOverlay').classList.add('hidden');c.run()}
function openPal(){$('#paletteOverlay').classList.remove('hidden');$('#palInput').value='';state.palIdx=0;renderPal();setTimeout(()=>$('#palInput').focus(),30)}

$$('.nitem[data-f]').forEach(n=>n.onclick=()=>setFolder(n.dataset.f));
$$('.ric[data-f]').forEach(n=>n.onclick=()=>setFolder(n.dataset.f));
$('#rows').addEventListener('click',e=>{
  const s=e.target.closest('[data-star]');
  if(s){e.stopPropagation();const m=mails.find(x=>x.id===+s.dataset.star);if(m){m.starred=!m.starred;renderList();renderRead()}return}
  const r=e.target.closest('.row');if(r)selectMail(+r.dataset.id)
});
$$('.tb[data-act]').forEach(b=>b.onclick=()=>doAct(b.dataset.act));
$('#listSearch').addEventListener('input',e=>{state.query=e.target.value.trim();renderList()});
$('#cmdBtn').onclick=openPal;$('#themeBtn').onclick=toggleTheme;
$('#composeBtn').onclick=openCompose;$('#cmpClose').onclick=()=>$('#composeOverlay').classList.add('hidden');
$('#cmpSend').onclick=()=>{const to=$('#cmpTo').value.trim();if(!to){toast('请填写收件人');return}$('#composeOverlay').classList.add('hidden');toast('邮件已发送 · 10 秒可撤销',()=>toast('已撤回发送'))};
$('#helpBtn').onclick=()=>$('#helpOverlay').classList.remove('hidden');$('#helpClose').onclick=()=>$('#helpOverlay').classList.add('hidden');
$('#settingBtn').onclick=()=>toast('设置');$('#sortBtn').onclick=()=>toast('按时间排序');
$('#palInput').addEventListener('input',()=>{state.palIdx=0;renderPal()});
const helps=[['j / k','上下移动'],['↵','打开邮件'],['e','归档'],['s','星标'],['u','撤销'],['r','回复'],['a','全部回复'],['f','转发'],['c','写邮件'],['/','搜索'],['⌘K','命令面板'],['?','快捷键']];
$('#helpBody').innerHTML=helps.map(([k,v])=>'<div class="kr"><span>'+v+'</span><span class="kbd">'+k+'</span></div>').join('');
$$('.overlay').forEach(o=>o.addEventListener('mousedown',e=>{if(e.target===o)o.classList.add('hidden')}));
document.addEventListener('keydown',e=>{
  const typing=['INPUT','TEXTAREA'].includes(e.target.tagName);
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openPal();return}
  if(e.key==='Escape'){$$('.overlay').forEach(o=>o.classList.add('hidden'));if(typing)e.target.blur();return}
  if(!$('#paletteOverlay').classList.contains('hidden')){
    if(e.key==='ArrowDown'){e.preventDefault();state.palIdx=Math.min(state.palItems.length-1,state.palIdx+1);renderPal()}
    else if(e.key==='ArrowUp'){e.preventDefault();state.palIdx=Math.max(0,state.palIdx-1);renderPal()}
    else if(e.key==='Enter'){e.preventDefault();execPal(state.palIdx)}
    return;
  }
  if(typing)return;
  const k=e.key.toLowerCase();
  if(k==='j'){e.preventDefault();move(1)}else if(k==='k'){e.preventDefault();move(-1)}
  else if(k==='e'){e.preventDefault();doAct('archive')}else if(k==='s'){e.preventDefault();doAct('star')}
  else if(k==='u'){e.preventDefault();const a=state.undo.pop();if(a){a.m.archived=a.wa;a.m.deleted=a.wd;renderAll();selectMail(a.m.id,false);toast('已撤销')}else toast('没有可撤销的操作')}
  else if(k==='r'){e.preventDefault();doAct('reply')}else if(k==='a'){e.preventDefault();doAct('replyall')}else if(k==='f'){e.preventDefault();doAct('forward')}
  else if(k==='c'){e.preventDefault();openCompose()}else if(k==='/'){e.preventDefault();$('#listSearch').focus()}
  else if(k==='?'){e.preventDefault();$('#helpOverlay').classList.remove('hidden')}
});
renderAll();

</script>
</body></html>
