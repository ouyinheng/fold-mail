[workspace]
resolver = "2"
members = [
    "crates/fold-core",
    "crates/fold-ipc",
    "crates/foldctl",
    "crates/fold-desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ouyinheng/fold-mail"

[workspace.lints.cargo]
unused_workspace_dependencies = "allow"

[workspace.dependencies]
# 内部 crate
fold-core = { path = "crates/fold-core" }

# 错误 / 日志
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 数据 / 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }

# 异步
tokio = { version = "1", features = ["full"] }

# 测试
tempfile = "3"
